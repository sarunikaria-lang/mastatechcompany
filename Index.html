<style>
  :root {
    --brand: #0F4C5C; --brand-light: #1B6B7E; --brand-dark: #0A3540;
    --accent: #F4A261; --accent-dark: #E08B47;
    --bg: #FAFAF7; --ink: #1F2937; --muted: #6B7280; --line: #E5E7EB;
    --ok: #10B981; --warn: #F59E0B; --danger: #EF4444;
    --card: #FFFFFF; --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --kcb: #005A2B; --gold: #B8860B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img { display: block; max-width: 100%; height: auto; }
  h1,h2,h3,h4 { font-family: 'Sora', sans-serif; line-height: 1.2; color: var(--brand-dark); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input,textarea,select { font: inherit; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 16px; }
  input:focus,textarea:focus,select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,76,92,.12); }
  textarea { min-height: 100px; resize: vertical; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 640px) { .container { padding: 0 24px; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: all .15s; white-space: nowrap; min-height: 44px; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-light); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-kcb { background: var(--kcb); color: #fff; }
  .btn-kcb:hover { background: #004420; }
  .btn-admin { background: linear-gradient(135deg, #991B1B, #DC2626); color: #fff; }
  .btn-admin:hover { background: #991B1B; }
  .btn-outline { border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn-outline:hover { border-color: var(--brand); color: var(--brand); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger-outline { border: 1px solid var(--danger); background: #fff; color: var(--danger); }
  .btn-danger-outline:hover { background: #FEF2F2; }
  .btn-ghost { color: var(--brand); padding: 8px 12px; }
  .btn-ghost:hover { background: rgba(15,76,92,.06); }
  .btn-sm { padding: 9px 14px; font-size: 13px; min-height: 36px; }
  .btn-xs { padding: 6px 10px; font-size: 12px; min-height: 30px; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card-hover { transition: all .2s; cursor: pointer; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); border-color: var(--brand); }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.5; background: #EEF2F5; color: var(--muted); white-space: nowrap; }
  .badge-ok { background: #D1FAE5; color: #065F46; }
  .badge-warn { background: #FEF3C7; color: #92400E; }
  .badge-info { background: #DBEAFE; color: #1E40AF; }
  .badge-demo { background: #FEF2F2; color: #991B1B; border: 1px dashed #FCA5A5; }
  .badge-accent { background: rgba(244,162,97,.15); color: var(--accent-dark); }
  .badge-admin { background: linear-gradient(135deg, #991B1B, #DC2626); color: #fff; }
  .badge-gold { background: linear-gradient(135deg, #B8860B, #DAA520); color: #fff; }

  header.nav { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Sora'; font-weight: 800; font-size: 18px; color: var(--brand-dark); flex-shrink: 0; }
  .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--accent)); display: grid; place-items: center; color: #fff; font-family: 'Sora'; font-weight: 800; font-size: 14px; }
  .nav-links { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
  .nav-links a { padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); transition: all .15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--brand); background: rgba(15,76,92,.06); }
  .nav-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .icon-btn { position: relative; padding: 10px; border-radius: 8px; font-size: 18px; line-height: 1; }
  .icon-btn:hover { background: rgba(15,76,92,.06); }
  .icon-btn .dot { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  .mobile-menu-btn { display: none; font-size: 24px; color: var(--brand); padding: 8px 10px; }
  @media (max-width: 900px) {
    .nav-links { display: none; width: 100%; flex-direction: column; align-items: stretch; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 12px 14px; font-size: 15px; }
    .mobile-menu-btn { display: block; }
  }

  .hero { position: relative; overflow: hidden; padding: 80px 0; color: #fff; background-color: var(--brand-dark); }
  .hero-bg { position: absolute; inset: 0; background-image: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=80'); background-size: cover; background-position: center; opacity: .35; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(10,53,64,.85) 0%, rgba(15,76,92,.75) 100%); }
  .hero > .container { position: relative; z-index: 1; }
  .hero h1 { font-size: clamp(28px, 5.5vw, 54px); color: #fff; max-width: 780px; margin-bottom: 20px; }
  .hero p { color: #D5E5EB; font-size: clamp(15px, 2vw, 18px); max-width: 640px; margin-bottom: 32px; }
  .hero .cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 640px) { .hero { padding: 48px 0; } }

  section { padding: 56px 0; }
  @media (min-width: 768px) { section { padding: 72px 0; } }
  section.compact { padding: 32px 0; }
  @media (min-width: 768px) { section.compact { padding: 44px 0; } }
  .section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
  .section-head h2 { font-size: clamp(22px, 3vw, 30px); }
  .section-head p { color: var(--muted); margin-top: 6px; }
  .eyebrow { color: var(--accent-dark); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; display: block; }

  .grid { display: grid; gap: 16px; }
  @media (min-width: 640px) { .grid { gap: 20px; } }
  .grid-2 { grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }
  .grid-3 { grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .grid-4 { grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

  .feature-card { padding: 22px; background: #fff; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); transition: all .2s; cursor: pointer; }
  .feature-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
  .feature-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(15,76,92,.1); color: var(--brand); display: grid; place-items: center; margin-bottom: 14px; font-size: 20px; }
  .feature-card h3 { font-size: 16px; margin-bottom: 6px; }
  .feature-card p { font-size: 14px; color: var(--muted); }

  .img-cover { width: 100%; border-radius: 10px; object-fit: cover; background: linear-gradient(135deg, #EEF2F5, #E2E8F0); }
  .img-card { height: 160px; margin-bottom: 12px; }

  .item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin: 6px 0; }
  .item-title { font-family: 'Sora'; font-weight: 700; font-size: 16px; color: var(--brand-dark); margin-bottom: 6px; line-height: 1.35; }
  .item-desc { font-size: 14px; color: #4B5563; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
  .filters > * { flex: 1 1 160px; min-width: 0; }
  .filters .btn { flex: 0 0 auto; }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty h3 { color: var(--muted); margin-bottom: 8px; font-size: 16px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .form-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .auth-shell { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: linear-gradient(135deg, #F0F9FB, #FAFAF7); }
  .auth-card { width: 100%; max-width: 480px; }
  .auth-card h2 { margin-bottom: 6px; font-size: 24px; }
  .auth-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  @media (min-width: 768px) { .stat-row { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .stat .label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .value { font-family: 'Sora'; font-size: 22px; font-weight: 700; color: var(--brand-dark); margin-top: 4px; word-break: break-word; }
  @media (min-width: 768px) { .stat .value { font-size: 26px; } }

  .dash-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 900px) { .dash-grid { grid-template-columns: 240px 1fr; gap: 24px; } .dash-side { position: sticky; top: 80px; height: fit-content; } }
  .dash-side { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .dash-side button { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; width: 100%; text-align: left; transition: all .15s; }
  .dash-side button:hover { background: rgba(15,76,92,.06); color: var(--brand); }
  .dash-side button.active { background: var(--brand); color: #fff; }

  .pricing-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .pricing-grid { grid-template-columns: repeat(4, 1fr); } }
  .plan-card { position: relative; display: flex; flex-direction: column; padding: 24px; }
  .plan-card.featured { border: 2px solid var(--brand); }
  @media (min-width: 1024px) { .plan-card.featured { transform: scale(1.03); } }
  .plan-card .plan-name { font-family: 'Sora'; font-weight: 700; font-size: 17px; }
  .plan-card .plan-price { font-family: 'Sora'; font-weight: 800; font-size: 30px; margin: 10px 0 4px; color: var(--brand-dark); }
  .plan-card .plan-price span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .plan-card ul { list-style: none; margin: 16px 0; flex: 1; }
  .plan-card ul li { display: flex; gap: 8px; font-size: 14px; padding: 6px 0; color: #4B5563; }
  .plan-card ul li::before { content: '✓'; color: var(--ok); font-weight: 700; flex-shrink: 0; }
  .ribbon { position: absolute; top: -10px; right: 16px; background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

  footer { background: var(--brand-dark); color: #C9D8DE; padding: 48px 0 20px; }
  footer h4 { color: #fff; font-size: 13px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .08em; }
  footer a { display: block; padding: 4px 0; font-size: 14px; color: #C9D8DE; }
  footer a:hover { color: var(--accent); }
  .footer-bottom { border-top: 1px solid rgba(255,255,255,.1); margin-top: 32px; padding-top: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; }

  #toast-wrap { position: fixed; bottom: 16px; right: 16px; left: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none; }
  @media (min-width: 640px) { #toast-wrap { left: auto; max-width: 380px; } }
  .toast { background: var(--ink); color: #fff; padding: 13px 18px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 14px; font-weight: 500; animation: slideIn .25s ease; pointer-events: auto; }
  .toast.ok { background: var(--ok); }
  .toast.err { background: var(--danger); }
  .toast.kcb { background: var(--kcb); }
  .toast.gold { background: var(--gold); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .cart-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  @media (min-width: 640px) { .cart-row { grid-template-columns: 1fr auto auto; } }

  .demo-notice { background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; padding: 10px 14px; border-radius: 10px; font-size: 12px; font-weight: 500; margin-bottom: 16px; }
  .info-notice { background: #F0F9FB; border: 1px solid #A5D6E0; color: var(--brand); padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
  .warn-notice { background: #FEF3C7; border: 1px solid #F59E0B; color: #92400E; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
  .admin-notice { background: linear-gradient(135deg, #FEE2E2, #FECACA); border: 1px solid #DC2626; color: #7F1D1D; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
  .gold-notice { background: linear-gradient(135deg, #FEF3C7, #FDE68A); border: 1px solid #D97706; color: #78350F; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }

  .kcb-box { background: linear-gradient(135deg, #005A2B, #004420); color: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .kcb-box h3 { color: #fff; margin-bottom: 4px; font-size: 15px; }
  .kcb-box .acc { font-family: 'Sora'; font-weight: 800; font-size: clamp(20px, 5vw, 28px); letter-spacing: .04em; margin: 8px 0; word-break: break-all; }
  .kcb-box .row { display: flex; justify-content: space-between; font-size: 13px; opacity: .9; padding: 4px 0; gap: 8px; }

  .video-box { aspect-ratio: 16/9; background: var(--brand-dark); border-radius: var(--radius); display: grid; place-items: center; color: #fff; font-family: 'Sora'; position: relative; overflow: hidden; }
  .video-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .video-box .play { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 50%; background: rgba(244,162,97,.9); display: grid; place-items: center; font-size: 22px; padding-left: 4px; }

  .chat-layout { display: grid; grid-template-columns: 1fr; gap: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); height: auto; }
  @media (min-width: 900px) { .chat-layout { grid-template-columns: 300px 1fr; height: 640px; } }
  .chat-list { border-right: none; overflow-y: auto; background: #FAFBFC; max-height: 260px; }
  @media (min-width: 900px) { .chat-list { border-right: 1px solid var(--line); max-height: none; } }
  .chat-list-head { padding: 14px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 2; }
  .chat-list-head h3 { font-size: 15px; margin-bottom: 10px; }
  .chat-conv { display: flex; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .15s; }
  .chat-conv:hover { background: #fff; }
  .chat-conv.active { background: #fff; border-left: 3px solid var(--brand); padding-left: 11px; }
  .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-light)); color: #fff; display: grid; place-items: center; font-family: 'Sora'; font-weight: 700; font-size: 15px; flex-shrink: 0; overflow: hidden; }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-avatar.admin { background: linear-gradient(135deg, #991B1B, #DC2626); }
  .chat-avatar.owner { background: linear-gradient(135deg, #B45309, #F59E0B); }
  .chat-avatar.instructor { background: linear-gradient(135deg, #4C1D95, #7C3AED); }
  .chat-conv-body { flex: 1; min-width: 0; }
  .chat-conv-name { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .chat-conv-name .role-tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: #EEF2F5; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chat-conv-name .role-tag.admin { background: #FEE2E2; color: #991B1B; }
  .chat-conv-name .role-tag.owner { background: #FEF3C7; color: #92400E; }
  .chat-conv-name .role-tag.instructor { background: #EDE9FE; color: #5B21B6; }
  .chat-conv-preview { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .chat-unread { background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; margin-left: 6px; }
  .chat-main { display: flex; flex-direction: column; overflow: hidden; height: 520px; }
  @media (min-width: 900px) { .chat-main { height: auto; } }
  .chat-main-head { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; display: flex; align-items: center; gap: 12px; }
  .chat-main-head .name { font-weight: 700; font-family: 'Sora'; font-size: 15px; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #F7FAFB; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .chat-msg.mine { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .chat-msg.theirs { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chat-msg-time { font-size: 10px; opacity: .7; margin-top: 4px; display: block; }
  .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: #fff; }
  .chat-input input { flex: 1; }
  .chat-empty { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 40px; text-align: center; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.responsive { width: 100%; border-collapse: collapse; font-size: 14px; }

const Backend = {
  DB_KEY: 'masatech_db_v4',
  PWD_KEY: 'masatech_passwords_v4',
  SESSION_KEY: 'masatech_session_v4',

  load() {
    const raw = localStorage.getItem(this.DB_KEY);
    return raw ? JSON.parse(raw) : null;
  },
  save(data) {
    try { localStorage.setItem(this.DB_KEY, JSON.stringify(data)); return { success: true }; }
    catch (e) { console.error('Backend.save error', e); return { success: false, error: e.message }; }
  },

  passwords: {
    list() { const raw = localStorage.getItem(Backend.PWD_KEY); return raw ? JSON.parse(raw) : []; },
    save(rows) { localStorage.setItem(Backend.PWD_KEY, JSON.stringify(rows)); },
    upsert(email, password, role, name) {
      const rows = this.list();
      const existing = rows.find(r => r.email.toLowerCase() === email.toLowerCase());
      const now = new Date().toISOString();
      if (existing) {
        existing.password = password; existing.role = role; existing.name = name; existing.updatedAt = now;
      } else {
        rows.push({ id: 'pw_' + uid(), email: email.toLowerCase(), password, role, name, isAdmin: email.toLowerCase() === ADMIN_EMAIL.toLowerCase(), createdAt: now, updatedAt: now, lastLogin: null });
      }
      this.save(rows);
    },
    recordLogin(email) {
      const rows = this.list();
      const r = rows.find(x => x.email.toLowerCase() === email.toLowerCase());
      if (r) { r.lastLogin = new Date().toISOString(); this.save(rows); }
    },
    verify(email, password) {
      return this.list().find(r => r.email.toLowerCase() === email.toLowerCase() && r.password === password) || null;
    },
    deleteByEmail(email) {
      this.save(this.list().filter(r => r.email.toLowerCase() !== email.toLowerCase()));
    },
  },

  users: {

      return user;

    delete(id) {
      const u = db.users.find(x => x.id === id);

    },
    delete(id) {
      const before = db.orders.length;
      db.orders = db.orders.filter(o => o.id !== id);
      Backend.save(db);
      return db.orders.length < before;
    },
    byUser(userId) { return db.orders.filter(o => o.userId === userId); },
    pending() { return db.orders.filter(o => o.status === 'PENDING_VERIFICATION'); },
    approved() { return db.orders.filter(o => o.status === 'APPROVED'); },
  },

  subscriptions: {
    byUser(userId) { return db.subscriptions.filter(s => s.userId === userId && s.status === 'ACTIVE'); },

  referrals: {

    byReferrer(userId) { return (db.referrals || []).filter(r => r.referrerId === userId); },
    create(r) {

      return r;

    markPaid(id) {

      r.status = 'PAID';
      r.paidAt = Date.now();
      Backend.save(db);
      return true;

    delete(id) {
      if (!db.referrals) return false;

      db.referrals = db.referrals.filter(r => r.id !== id);
      Backend.save(db);
      return db.referrals.length < before;
    },
    pending() { return (db.referrals || []).filter(r => r.status === 'PENDING'); },
    paid() { return (db.referrals || []).filter(r => r.status === 'PAID'); },
  },

  discussions: {
    create(d) { db.discussions.push(d); Backend.save(db); return d; },
    delete(id) {
      const before = db.discussions.length;
      db.discussions = db.discussions.filter(x => x.id !== id);
      delete db.comments[id];
      Backend.save(db);
      return db.discussions.length < before;
    },
  },

  conversations: {
    byUser(userId) { return db.conversations.filter(c => c.participants.includes(userId)); },
    delete(id) {
      const before = db.conversations.length;
      db.conversations = db.conversations.filter(c => c.id !== id);
      Backend.save(db);
      return db.conversations.length < before;
    },
    deleteMessage(convId, msgId) {
      const c = db.conversations.find(x => x.id === convId);
      if (!c) return false;
      const before = c.messages.length;
      c.messages = c.messages.filter(m => m.id !== msgId);
      Backend.save(db);
      return c.messages.length < before;
    },
  },

  exportJSON() {
    return { exportedAt: new Date().toISOString(), app: APP_NAME, data: db, passwords: this.passwords.list() };
  },
};

let db = Backend.load() || seed();
let session = JSON.parse(localStorage.getItem(Backend.SESSION_KEY) || 'null');

(function bootstrap() {
  // Ensure schema completeness
  if (!db.referrals) db.referrals = [];
  db.users.forEach(u => {
    if (!u.referralCode) u.referralCode = 'MST-' + u.id.replace(/[^a-z0-9]/gi, '').slice(0, 6).toUpperCase();
    if (u.referralEarnings === undefined) u.referralEarnings = 0;
    if (u.referredBy === undefined) u.referredBy = null;
  });
  if (Backend.passwords.list().length === 0) {
    db.users.forEach(u => Backend.passwords.upsert(u.email, u.password, u.role, u.name));
    Backend.passwords.upsert(ADMIN_EMAIL, ADMIN_PASSWORD, 'ADMIN', 'Admin');
  }
  if (!Backend.load()) Backend.save(db);
})();

const save = () => Backend.save(db);
const currentUser = () => session ? db.users.find(u => u.id === session.userId) : null;
const isAdmin = () => {
  const u = currentUser();
  return u && u.role === 'ADMIN' && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
};
const login = (u) => {
  session = { userId: u.id, name: u.name, email: u.email, role: u.role };
  localStorage.setItem(Backend.SESSION_KEY, JSON.stringify(session));
  Backend.passwords.recordLogin(u.email);
};
const logout = () => {
  session = null;
  localStorage.removeItem(Backend.SESSION_KEY);
  navigate('home');
};
const currentRoute = () => {
  const h = location.hash.replace('#', '');
  if (!h) return { name: 'home' };
  try { return JSON.parse(decodeURIComponent(h)); } catch { return { name: 'home' }; }
};
const navigate = (name, params = {}) => {
  location.hash = encodeURIComponent(JSON.stringify({ name, ...params }));
};

function emailDocumentToUser(userId) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  const user = db.users.find(u => u.id === userId);
  if (!user) return toast('User not found.', 'err');

  const subject = 'Your MASTATECH Membership Document';
  const body = 'Dear ' + user.name + ',\n\n' +
    'Please find attached your official MASTATECH Member Record Document.\n\n' +
    'This document confirms your registration on the MASTATECH Global Business Network and is issued for your records. ' +
    'It includes your member ID, account summary, and document ID for verification purposes.\n\n' +
    'If you need to verify this document or have any questions, please contact us at ' + SUPPORT_EMAIL + '.\n\n' +
    'Best regards,\nMASTATECH Administration\n' + SUPPORT_EMAIL + '\nmasatech.io';

  openEmailModal(user, subject, body);
}

function openEmailModal(user, subject, body) {
  const existing = $('#email-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'email-modal';
  modal.innerHTML =
    '<div class="modal-content">' +
      '<div class="modal-header"><h2>Email document to ' + esc(user.name) + '</h2><button class="modal-close" onclick="closeEmailModal()" aria-label="Close">×</button></div>' +
      '<div class="modal-body">' +
        '<div class="info-notice">📄 <strong>Step 1:</strong> Click "Print document" below. Choose "Save as PDF" in the print dialog.<br><br>📧 <strong>Step 2:</strong> Click "Open email app" — your mail client opens pre-filled. Attach the PDF and send.</div>' +
        '<div class="form-group"><label>To (recipient)</label><input id="email-to" value="' + esc(user.email) + '" readonly /></div>' +
        '<div class="form-group"><label>Subject</label><input id="email-subject" value="' + esc(subject) + '" /></div>' +
        '<div class="form-group"><label>Message</label><textarea id="email-body" style="min-height:180px;font-family:inherit;">' + esc(body) + '</textarea></div>' +
      '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn btn-outline btn-sm" onclick="copyEmailContent()">📋 Copy all</button>' +
        '<button class="btn btn-outline btn-sm" onclick="reprintDocument(\'' + user.id + '\')">🖨 Print document</button>' +
        '<button class="btn btn-accent" onclick="openMailto()">📧 Open email app</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
}

function closeEmailModal() {
  const m = $('#email-modal');
  if (m) m.remove();
}

function copyEmailContent() {
  const to = $('#email-to').value;
  const subject = $('#email-subject').value;
  const body = $('#email-body').value;
  const content = 'To: ' + to + '\nSubject: ' + subject + '\n\n' + body;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(content).then(() => toast('Copied to clipboard.', 'ok')).catch(() => toast('Copy failed.', 'err'));
  } else {
    toast('Copy not available.', 'err');
  }
}

function openMailto() {
  const to = $('#email-to').value;
  const subject = $('#email-subject').value;
  let body = $('#email-body').value;
  body += '\n\n[Please attach the printed PDF file before sending]';
  const mailto = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  if (mailto.length > 1900) {
    const shortBody = body.slice(0, 800) + '\n\n[Message truncated — PDF attached separately]';
    window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(shortBody);
  } else {
    window.location.href = mailto;
  }
  toast('Email app opened. Attach the PDF and send.', 'ok');
}

function reprintDocument(userId) {
  const user = db.users.find(u => u.id === userId);
  if (user) printMemberDocument(user);
}

   ============================================================ */
function adminEnrollCourse(courseId) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  const u = currentUser();
  const c = db.courses.find(x => x.id === courseId);
  if (!c) return;
  const existing = db.enrollments.find(e => e.userId === u.id && e.courseId === c.id && e.status === 'ACTIVE');
  if (!existing) {
    db.enrollments.push({ id: uid(), userId: u.id, courseId: c.id, completedLessons: [], status: 'ACTIVE', createdAt: Date.now(), isAdminGrant: true });
    save();
  }
  toast('🛡 Admin enrollment granted.', 'ok');
  navigate('learn', { courseId: c.id });
}

function adminActivatePlan(planId) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  const u = currentUser();
  const plan = db.plans.find(p => p.id === planId);
  if (!plan) return;
  Backend.subscriptions.activate(u.id, planId);
  toast('🛡 Admin activated: ' + plan.name, 'ok');
  navigate('dashboard');
}

function adminGetProduct(productId) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  const u = currentUser();
  const p = db.products.find(x => x.id === productId);
  if (!p) return;
  const orderId = 'ord_' + uid();
  Backend.orders.create({
    id: orderId, userId: u.id,
    items: [{ title: p.title, qty: 1, price: p.price, productId: p.id }],
    total: p.price, status: 'APPROVED',
    bankReference: 'ADMIN-BYPASS', provider: 'KCB',
    isAdminGrant: true,
    createdAt: Date.now(), approvedAt: Date.now()
  });
  if (p.courseId) {
    const c = db.courses.find(x => x.id === p.courseId);
    if (c && !db.enrollments.find(e => e.userId === u.id && e.courseId === c.id)) {
      db.enrollments.push({ id: uid(), userId: u.id, courseId: c.id, completedLessons: [], status: 'ACTIVE', createdAt: Date.now(), isAdminGrant: true });
    }
  }
  save();
  toast('🛡 Admin access granted.', 'ok');
  render();
}

/* ============ UNREAD CHAT ============ */
function totalUnreadChat() {
  const u = currentUser(); if (!u) return 0;
  let n = 0;
  for (const conv of db.conversations) {
    if (!conv.participants.includes(u.id)) continue;
    for (const m of conv.messages) {
      if (m.from !== u.id && !(m.readBy || []).includes(u.id)) n++;
    }
  }
  return n;
}

function doLogin() {
  const email = $('#login-email').value.trim().toLowerCase();
  const password = $('#login-password').value;
  if (!email || !password) return $('#login-error').innerHTML = '<div class="form-error">Enter email and password.</div>';
  const record = Backend.passwords.verify(email, password);
  if (!record) return $('#login-error').innerHTML = '<div class="form-error">Incorrect email or password.</div>';
  let user = db.users.find(x => x.email.toLowerCase() === email);
  if (!user) {
    user = { id: 'u_' + uid(), name: record.name || email.split('@')[0], email, password, phone: '', role: record.role || 'USER', country: '', city: '', headline: 'MASTATECH member', referralCode: generateReferralCode(), referredBy: null, referralEarnings: 0, createdAt: Date.now() };
    db.users.push(user); save();
  }
  login(user);
  toast('Welcome, ' + user.name.split(' ')[0] + '!', 'ok');
  navigate(user.role === 'ADMIN' ? 'admin' : 'dashboard');
}

function autoDetectCountry(phone) {
  const country = detectCountryFromPhone(phone);
  if (!country) return;
  const sel = $('#reg-country');
  if (!sel) return;
  for (const opt of sel.options) {
    if (opt.value === country) { sel.value = country; return; }
  }
  const newOpt = document.createElement('option');
  newOpt.value = country; newOpt.textContent = country;
  sel.insertBefore(newOpt, sel.lastElementChild);
  sel.value = country;
}
function doRegister() {
  const name = $('#reg-name').value.trim();
  const email = $('#reg-email').value.trim().toLowerCase();
  const password = $('#reg-password').value;
  const phone = $('#reg-phone').value.trim();
  const country = $('#reg-country').value;
  const city = $('#reg-city').value.trim();
  const role = $('#reg-role').value;
  const refCode = $('#reg-referral').value.trim().toUpperCase();

  if (name.length < 2) return $('#reg-error').innerHTML = '<div class="form-error">Full name required.</div>';
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) return $('#reg-error').innerHTML = '<div class="form-error">Valid email required.</div>';
  if (password.length < 8) return $('#reg-error').innerHTML = '<div class="form-error">Password must be 8+ characters.</div>';
  const phoneDigits = phone.replace(/\D/g, '');
  if (phoneDigits.length < 8) return $('#reg-error').innerHTML = '<div class="form-error">Valid phone required (min 8 digits).</div>';
  if (phoneDigits.length > 15) return $('#reg-error').innerHTML = '<div class="form-error">Phone too long.</div>';
  if (!country) return $('#reg-error').innerHTML = '<div class="form-error">Select your country.</div>';
  if (db.users.find(u => u.email.toLowerCase() === email)) return $('#reg-error').innerHTML = '<div class="form-error">Email already registered.</div>';
  if (email === ADMIN_EMAIL.toLowerCase()) return $('#reg-error').innerHTML = '<div class="form-error">This email is reserved.</div>';

  // Validate referral code if provided
  let referrer = null;
  if (refCode) {
    referrer = db.users.find(x => (x.referralCode || '').toUpperCase() === refCode);
    if (!referrer) return $('#reg-error').innerHTML = '<div class="form-error">Invalid referral code.</div>';
    if (referrer.email.toLowerCase() === email) return $('#reg-error').innerHTML = '<div class="form-error">You cannot refer yourself.</div>';
  }

  const myReferralCode = generateReferralCode();
  const u = {
    id: uid(), name, email, password, phone, role, country, city,
    headline: 'MASTATECH member',
    avatar: null,
    referralCode: myReferralCode,
    referredBy: referrer ? referrer.id : null,
    referralEarnings: 0,
    createdAt: Date.now()
  };
  Backend.users.create(u);

  if (referrer) {
    // Credit referrer
    referrer.referralEarnings = (referrer.referralEarnings || 0) + REFERRAL_BONUS;
    Backend.referrals.create({
      id: uid(),
      referrerId: referrer.id,
      referredUserId: u.id,
      amount: REFERRAL_BONUS,
      status: 'PENDING',
      createdAt: Date.now(),
      paidAt: null
    });
    Backend.notifications.create({
      id: uid(), userId: referrer.id,
      title: '🎉 New referral!',
      body: u.name + ' joined using your code. You earned ' + money(REFERRAL_BONUS) + '.',
      createdAt: Date.now(), read: false
    });
    save();
  }

  Backend.subscriptions.activate(u.id, 'free');
  Backend.notifications.create({
    id: uid(), userId: u.id,
    title: 'Welcome to ' + APP_NAME,
    body: 'Your account is ready. Share your referral code ' + myReferralCode + ' to earn ' + money(REFERRAL_BONUS) + ' per signup!',
    createdAt: Date.now(), read: false
  });
  login(u);
  toast('Welcome! Your code: ' + myReferralCode, 'ok');
  navigate('dashboard');
}

function copyReferralCode() {
  const u = currentUser();
  if (!u || !u.referralCode) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(u.referralCode).then(() => toast('Referral code copied!', 'ok')).catch(() => toast('Copy failed.', 'err'));
  } else {
    toast('Code: ' + u.referralCode, 'ok');
  }
}
function copyReferralLink() {
  const u = currentUser();
  if (!u) return;
  const link = 'masatech.io/?ref=' + u.referralCode;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => toast('Link copied!', 'ok')).catch(() => toast('Copy failed.', 'err'));
  } else {
    toast('Link: ' + link, 'ok');
  }
}
function clearMyNotifications() {
  const u = currentUser(); if (!u) return;
  if (!confirm('Clear all notifications?')) return;
  Backend.notifications.clearFor(u.id);
  toast('Cleared.', 'ok'); render();
}
function deleteNotification(id) {
  Backend.notifications.delete(id);
  toast('Deleted.', 'ok'); render();
}

        '<div class="stat" style="background:#fff;"><div class="label">Bonus per signup</div><div class="value" style="font-size:20px;">KES 200</div></div>' +
      '</div>' +
      (allReferrals.length === 0 ? '<p style="color:#78350F;margin-top:12px;">No referrals yet.</p>' :
        '<h4 style="margin-top:16px;margin-bottom:8px;color:#78350F;font-size:14px;">All referrals</h4>' +
        allReferrals.slice().reverse().map(r => {
          const referrer = db.users.find(u => u.id === r.referrerId);
          const referred = db.users.find(u => u.id === r.referredUserId);
          return '<div class="record-row" style="border-color:#FDE68A;">' +
            '<div class="record-body">' +
              '<strong>' + esc(referrer?.name || 'Unknown') + '</strong> → <strong>' + esc(referred?.name || 'Unknown') + '</strong>' +
              '<div class="item-meta">' + new Date(r.createdAt).toLocaleDateString() + (r.paidAt ? ' · Paid ' + new Date(r.paidAt).toLocaleDateString() : '') + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:6px;align-items:center;">' +
              '<strong style="color:#B8860B;">' + money(r.amount) + '</strong>' +
              '<span class="badge ' + (r.status === 'PAID' ? 'badge-ok' : 'badge-warn') + '">' + r.status + '</span>' +
              (r.status === 'PENDING' ? '<button class="btn btn-accent btn-xs" onclick="markReferralPaid(\'' + r.id + '\')">✓ Mark Paid</button>' : '') +
              '<button class="btn btn-danger-outline btn-xs" onclick="deleteReferral(\'' + r.id + '\')">🗑</button>' +
            '</div>' +
          '</div>';
        }).join('')) +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap;"><h3 style="margin:0;">All users (' + db.users.length + ')</h3><button class="btn btn-danger-outline btn-sm" onclick="deleteAllUsers()">🗑 Delete ALL users</button></div>' +
      '<div class="table-wrap"><table class="responsive">' +
        '<thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Country</th><th>Referrals</th><th>Document</th><th>Actions</th></tr></thead>' +
        '<tbody>' +
        db.users.map(x => {
          const refCount = Backend.referrals.byReferrer(x.id).length;
          const refEarn = (x.referralEarnings || 0);
          return '<tr>' +
            '<td>' + esc(x.name) + '</td>' +
            '<td style="word-break:break-all;">' + esc(x.email) + '</td>' +
            '<td>' + esc(x.phone || '—') + '</td>' +
            '<td><span class="badge badge-info">' + esc(x.role) + '</span></td>' +
            '<td>' + esc(x.country || '—') + '</td>' +
            '<td>' + refCount + ' <span style="color:var(--gold);font-weight:700;">(' + money(refEarn) + ')</span></td>' +
            '<td style="white-space:nowrap;">' +
              '<button class="btn btn-outline btn-xs" onclick="printDoc(\'' + x.id + '\')" title="Print PDF">🖨</button> ' +
              '<button class="btn btn-accent btn-xs" onclick="emailDocumentToUser(\'' + x.id + '\')" title="Email">📧</button>' +
            '</td>' +
            '<td style="text-align:right;white-space:nowrap;">' +
              '<button class="btn btn-ghost btn-xs" onclick="startChatWith(\'' + x.id + '\')">💬</button>' +
              (x.id !== u.id ? '<button class="btn btn-danger-outline btn-xs" onclick="deleteUser(\'' + x.id + '\')">🗑</button>' : '') +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<h3 style="margin-bottom:16px;">Pending payments (' + pendingOrders.length + ')</h3>' +
      (pendingOrders.length === 0 ? '<p style="color:var(--muted);">No pending payments.</p>' : pendingOrders.map(o => {
        const buyer = db.users.find(x => x.id === o.userId);
        return '<div class="record-row">' +
          '<div class="record-body"><strong>' + esc(buyer?.name || 'Unknown') + '</strong> · ' + esc(buyer?.email || '') +
            '<div class="item-meta">Ref: <code>' + esc(o.bankReference || '—') + '</code> · ' + new Date(o.createdAt).toLocaleString() + '</div>' +
            '<div style="font-size:13px;color:#4B5563;">' + o.items.map(i => esc(i.title) + ' × ' + i.qty).join(' · ') + '</div></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;"><strong style="color:var(--brand);">' + money(o.total) + '</strong>' +
            '<div style="display:flex;gap:4px;flex-wrap:wrap;">' +
              '<button class="btn btn-primary btn-xs" onclick="approveOrder(\'' + o.id + '\')">✓</button>' +
              '<button class="btn btn-outline btn-xs" onclick="rejectOrder(\'' + o.id + '\')">✕</button>' +
              '<button class="btn btn-danger-outline btn-xs" onclick="deleteOrder(\'' + o.id + '\')">🗑</button>' +
            '</div></div>' +
        '</div>';
      }).join('')) +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<h3 style="margin-bottom:16px;">Business verification queue</h3>' +
      (db.businesses.filter(b => !b.verified).length === 0 ? '<p style="color:var(--muted);">No pending.</p>' :
        db.businesses.filter(b => !b.verified).map(b =>
          '<div class="record-row"><div class="record-body"><strong>' + esc(b.name) + '</strong><div class="item-meta">' + esc(b.city) + ', ' + esc(b.country) + '</div></div>' +
          '<div style="display:flex;gap:4px;"><button class="btn btn-primary btn-xs" onclick="verifyBusiness(\'' + b.id + '\')">Verify</button><button class="btn btn-danger-outline btn-xs" onclick="deleteBusiness(\'' + b.id + '\')">🗑</button></div></div>').join('')) +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;"><div><h3 style="margin-bottom:4px;">Admin database: <code>passwords</code></h3><p style="color:var(--muted);font-size:13px;">' + pwdRows.length + ' records</p></div><button class="btn btn-outline btn-sm" onclick="exportPasswords()">⬇ Export</button></div>' +
      '<div class="warn-notice">⚠️ Plaintext passwords visible. For production, hash with bcrypt server-side.</div>' +
      pwdRows.map(r => '<div class="pw-row"><div style="flex:1;min-width:180px;"><div class="pw-email">' + esc(r.email) + ' ' + (r.isAdmin ? '<span class="badge badge-demo">ADMIN</span>' : '') + '</div><div class="item-meta">' + esc(r.role) + ' · Last login: ' + (r.lastLogin ? new Date(r.lastLogin).toLocaleString() : 'never') + '</div></div><div><code>' + esc(r.password) + '</code></div></div>').join('') +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<h3 style="margin-bottom:16px;">All orders (' + db.orders.length + ')</h3>' +
      (db.orders.length === 0 ? '<p style="color:var(--muted);">None.</p>' :
        db.orders.slice().reverse().map(o => {
          const buyer = db.users.find(x => x.id === o.userId);
          return '<div class="record-row">' +
            '<div class="record-body"><strong>' + esc(buyer?.name || 'Unknown') + '</strong> — ' + esc(o.items.map(i => i.title).join(', ')) +
              '<div class="item-meta">' + money(o.total) + ' · Ref: ' + esc(o.bankReference || '—') + ' · ' + new Date(o.createdAt).toLocaleString() + '</div></div>' +
            '<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">' +
              '<span class="badge ' + (o.status === 'APPROVED' ? 'badge-ok' : o.status === 'REJECTED' ? 'badge-demo' : 'badge-warn') + '">' + esc(o.status.replace('_', ' ')) + '</span>' +
              (o.status === 'APPROVED' ? '<button class="btn btn-kcb btn-xs" onclick="printReceipt(\'' + o.id + '\')">🖨 Receipt</button>' : '') +
              '<button class="btn btn-danger-outline btn-xs" onclick="deleteOrder(\'' + o.id + '\')">🗑</button>' +
            '</div>' +
          '</div>';
        }).join('')) +
    '</div>' +

    '<div class="card" style="margin-bottom:20px;">' +
      '<h3 style="margin-bottom:16px;">Conversations (' + db.conversations.length + ')</h3>' +
      db.conversations.map(c => {
        const participants = c.participants.map(id => db.users.find(u => u.id === id)?.name || 'Unknown').join(' ↔ ');
        return '<div class="record-row"><div class="record-body"><strong>' + esc(participants) + '</strong><div class="item-meta">' + c.messages.length + ' messages</div></div><button class="btn btn-danger-outline btn-xs" onclick="deleteConversation(\'' + c.id + '\')">🗑</button></div>';
      }).join('') +
    '</div>' +
  '</div></section>';
}

function markReferralPaid(id) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  if (!confirm('Mark this referral as paid?')) return;
  Backend.referrals.markPaid(id);
  toast('Referral marked as paid.', 'ok'); render();
}
function deleteReferral(id) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  if (!confirm('Delete this referral record?')) return;
  Backend.referrals.delete(id);
  toast('Referral deleted.', 'ok'); render();
}
function printDoc(userId) {
  if (!isAdmin()) return toast('Admin only.', 'err');
  const u = db.users.find(x => x.id === userId);
  if (!u) return toast('User not found.', 'err');
  printMemberDocument(u);
}
function approveOrder(id) {
  const o = Backend.orders.get(id); if (!o) return;
  Backend.orders.update(id, { status: 'APPROVED', approvedAt: Date.now() });
  for (const item of o.items) {
    if (item.planId) Backend.subscriptions.activate(o.userId, item.planId);
    if (item.courseId) {
      const exists = db.enrollments.find(e => e.userId === o.userId && e.courseId === item.courseId && e.status === 'ACTIVE');
      if (!exists) db.enrollments.push({ id: uid(), userId: o.userId, courseId: item.courseId, completedLessons: [], status: 'ACTIVE', createdAt: Date.now() });
    }
  }
  Backend.notifications.create({ id: uid(), userId: o.userId, title: '✓ Payment confirmed', body: 'Order ' + o.id + ' confirmed. Download your receipt from the dashboard.', createdAt: Date.now(), read: false });
  save(); toast('Confirmed. Receipt now available.', 'ok'); render();
}
function rejectOrder(id) {
  const o = Backend.orders.get(id); if (!o) return;
  const reason = prompt('Reason:') || 'Not verified.';
  Backend.orders.update(id, { status: 'REJECTED', rejectionReason: reason });
  Backend.notifications.create({ id: uid(), userId: o.userId, title: 'Payment rejected', body: 'Order ' + o.id + ': ' + reason, createdAt: Date.now(), read: false });
  save(); toast('Rejected.', 'err'); render();
}
function deleteOrder(id) {
  if (!confirm('Delete order?')) return;
  Backend.orders.delete(id);
  toast('Deleted.', 'ok'); render();
}
function deleteUser(id) {
  const u = Backend.users.get(id); if (!u) return;
  if (!confirm('Permanently delete ' + u.name + ' and all data?')) return;
  Backend.users.delete(id);
  toast('User deleted.', 'ok'); render();
}
function deleteAllUsers() {
  if (!confirm('⚠️ Delete ALL users except you?')) return;
  if (!confirm('Second confirmation?')) return;
  const me = currentUser();
  const others = db.users.filter(u => u.id !== me.id);
  others.forEach(u => Backend.users.delete(u.id));
  toast(others.length + ' users deleted.', 'ok'); render();
}
function deleteBusiness(id) {
  if (!confirm('Delete business?')) return;
  Backend.businesses.delete(id);
  toast('Deleted.', 'ok'); render();
}
function deleteConversation(id) {
  if (!confirm('Delete conversation?')) return;
  Backend.conversations.delete(id);
  toast('Deleted.', 'ok'); render();
}
function verifyBusiness(id) {
  Backend.businesses.verify(id);
  toast('Verified.', 'ok'); render();
}
function exportPasswords() {
  const blob = new Blob([JSON.stringify(Backend.passwords.list(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'masatech-passwords.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Exported.', 'ok');
}

/* ============ CHAT ============ */
function viewChat(p = {}) {
  const me = currentUser(); if (!me) { navigate('login'); return ''; }
  const withUserId = p.with || null;
  const other = withUserId ? db.users.find(x => x.id === withUserId) : null;
  const myConvs = Backend.conversations.byUser(me.id);
  const roleRank = { ADMIN: 0, BUSINESS_OWNER: 1, INSTRUCTOR: 2, USER: 3 };
  const others = db.users.filter(u => u.id !== me.id).sort((a, b) => (roleRank[a.role] ?? 9) - (roleRank[b.role] ?? 9));
  const convByUser = {};
  for (const conv of myConvs) {
    const otherId = conv.participants.find(pid => pid !== me.id);
    if (otherId) convByUser[otherId] = conv;
  }
  const threads = others.map(u => {
    const conv = convByUser[u.id];
    const last = conv?.messages[conv.messages.length - 1];
    const unread = conv ? conv.messages.filter(m => m.from !== me.id && !(m.readBy || []).includes(me.id)).length : 0;
    return { user: u, conv, last, unread };
  }).sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0));
  const thread = other ? threads.find(t => t.user.id === other.id) : null;
  const messages = thread?.conv?.messages || [];
  if (thread?.conv) {
    let changed = false;
    for (const m of thread.conv.messages) {
      if (m.from !== me.id) {
        if (!m.readBy) m.readBy = [];
        if (!m.readBy.includes(me.id)) { m.readBy.push(me.id); changed = true; }
      }
    }
    if (changed) save();
  }
  const roleTag = (role) => {
    const cls = { ADMIN: 'admin', BUSINESS_OWNER: 'owner', INSTRUCTOR: 'instructor' }[role] || '';
    const label = { ADMIN: 'Admin', BUSINESS_OWNER: 'Owner', INSTRUCTOR: 'Instructor', USER: 'Member' }[role] || 'Member';
    return '<span class="role-tag ' + cls + '">' + label + '</span>';
  };
  const avatarCls = (role) => ({ ADMIN: 'admin', BUSINESS_OWNER: 'owner', INSTRUCTOR: 'instructor' }[role] || '');
  const avatar = (u) => u.avatar
    ? '<div class="chat-avatar ' + avatarCls(u.role) + '"><img src="' + esc(u.avatar) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + esc(u.name[0]) + '\'"/></div>'
    : '<div class="chat-avatar ' + avatarCls(u.role) + '">' + esc(u.name[0]) + '</div>';

  return '<section class="compact"><div class="container">' +
    '<h1 style="font-size:clamp(22px,4vw,28px);margin-bottom:20px;">Messages</h1>' +
    '<div class="chat-layout">' +
      '<aside class="chat-list"><div class="chat-list-head"><h3>Conversations</h3><input placeholder="Search…" oninput="filterChatList(this.value)" /></div><div id="chat-conv-list">' +
        threads.map(t => '<div class="chat-conv ' + (other && other.id === t.user.id ? 'active' : '') + '" data-name="' + esc(t.user.name.toLowerCase()) + '" onclick="openChatWith(\'' + t.user.id + '\')">' + avatar(t.user) + '<div class="chat-conv-body"><div class="chat-conv-name"><span>' + esc(t.user.name) + ' ' + roleTag(t.user.role) + '</span>' + (t.unread ? '<span class="chat-unread">' + t.unread + '</span>' : '') + '</div><div class="chat-conv-preview">' + (t.last ? esc(t.last.body.slice(0, 50)) : 'No messages yet') + '</div></div></div>').join('') +
      '</div></aside>' +
      '<div class="chat-main">' +
        (!other
          ? '<div class="chat-empty"><div style="text-align:center;"><div style="font-size:48px;">💬</div><h3>Select a person</h3></div></div>'
          : '<div class="chat-main-head">' + avatar(other) + '<div style="flex:1;"><div class="name">' + esc(other.name) + ' ' + roleTag(other.role) + '</div><div class="item-meta" style="margin:0;">' + esc(other.headline || '') + '</div></div></div>' +
            '<div class="chat-messages" id="chat-messages">' +
              (messages.length === 0 ? '<div class="chat-empty"><div>Say hello 👋</div></div>' :
                messages.map(m => {
                  const mine = m.from === me.id;
                  const delBtn = mine ? '<button class="btn btn-ghost btn-xs" onclick="if(confirm(\'Delete?\')){deleteMessage(\'' + thread.conv.id + '\',\'' + m.id + '\');}" style="opacity:.4;font-size:10px;padding:0;margin-left:6px;">✕</button>' : '';
                  return '<div class="chat-msg ' + (mine ? 'mine' : 'theirs') + '">' + esc(m.body) + delBtn + '<span class="chat-msg-time">' + new Date(m.at).toLocaleString() + '</span></div>';
                }).join('')) +
            '</div>' +
            '<div class="chat-input"><input id="chat-input" placeholder="Type a message…" onkeydown="if(event.key===\'Enter\')sendMessage(\'' + other.id + '\')" /><button class="btn btn-primary" onclick="sendMessage(\'' + other.id + '\')">Send</button></div>') +
      '</div>' +
    '</div>' +
  '</div></section>';
}
function filterChatList(q) {
  q = q.toLowerCase();
  $$('#chat-conv-list .chat-conv').forEach(el => {
    el.style.display = (el.getAttribute('data-name') || '').includes(q) ? '' : 'none';
  });
}
function openChatWith(userId) { navigate('chat', { with: userId }); }
function startChatWith(userId) { navigate('chat', { with: userId }); }
function ensureConversation(meId, otherId) {
  let conv = db.conversations.find(c => c.participants.length === 2 && c.participants.includes(meId) && c.participants.includes(otherId));
  if (!conv) {
    conv = { id: 'conv_' + uid(), participants: [meId, otherId], createdAt: Date.now(), messages: [] };
    db.conversations.push(conv);
  }
  return conv;
}
function sendMessage(otherId) {
  const me = currentUser(); if (!me) return;
  const input = $('#chat-input'); if (!input) return;
  const body = input.value.trim(); if (!body) return;
  const conv = ensureConversation(me.id, otherId);
  conv.messages.push({ id: 'm_' + uid(), from: me.id, body, at: Date.now(), readBy: [me.id] });
  save(); input.value = ''; render();
}
function deleteMessage(convId, msgId) {
  Backend.conversations.deleteMessage(convId, msgId);
  toast('Deleted.', 'ok'); render();
}

/* ============ 404 ============ */
function notFound() {
  return '<section><div class="container"><div class="empty"><h2>Page not found</h2><button class="btn btn-primary" style="margin-top:16px;" onclick="navigate(\'home\');return false;">← Home</button></div></div></section>';
}

/* ============ RENDER ============ */
function render() {
  const r = currentRoute();
  let content = '';
  switch (r.name) {
    case 'home': content = viewHome(); break;
    case 'directory': content = viewDirectory(r); break;
    case 'business-detail': content = viewBusinessDetail(r); break;
    case 'knowledge': content = viewKnowledge(r); break;
    case 'resource-detail': content = viewResourceDetail(r); break;
    case 'community': content = viewCommunity(); break;
    case 'discussion-detail': content = viewDiscussionDetail(r); break;
    case 'opportunities': content = viewOpportunities(); break;
    case 'academy': content = viewAcademy(); break;
    case 'course-detail': content = viewCourseDetail(r); break;
    case 'learn': content = viewLearn(r); break;
    case 'store': content = viewStore(); break;
    case 'cart': content = viewCart(); break;
    case 'checkout': content = viewCheckout(); break;
    case 'pay-course': content = viewPayCourse(r); break;
    case 'pay-plan': content = viewPayPlan(r); break;
    case 'pricing': content = viewPricing(); break;
    case 'login': content = viewLogin(); break;
    case 'register': content = viewRegister(); break;
    case 'dashboard': content = viewDashboard(); break;
    case 'admin': content = viewAdmin(); break;
    case 'chat': content = viewChat(r); break;
    default: content = notFound();
  }
  document.getElementById('app').innerHTML = Header() + '<main>' + content + '</main>' + Footer();
  window.scrollTo({ top: 0 });
  const msgs = document.getElementById('chat-messages');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);
render();
</script>
